
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink: var(--color-text-primary);
    --muted: var(--color-text-secondary);
    --faint: var(--color-text-tertiary);
    --surface: var(--color-background-secondary);
    --border: var(--color-border-tertiary);
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --green: #16A34A;
    --green-bg: #F0FDF4;
    --amber: #B45309;
    --amber-bg: #FFFBEB;
  }
  @media(prefers-color-scheme:dark){
    :root{--accent:#60A5FA;--accent-bg:#1e3a5f22;--green:#4ADE80;--green-bg:#14532d22;--amber:#FCD34D;--amber-bg:#451a0322}
  }
  body{font-family:'Sora',sans-serif;padding:0;background:transparent}
  .header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .header-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
  .header-title{font-size:15px;font-weight:600;color:var(--ink)}
  .screens{display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:box-shadow .15s}
  .card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:var(--surface);user-select:none}
  .screen-num{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--accent);background:var(--accent-bg);border:1px solid currentColor;border-radius:4px;padding:2px 7px;opacity:.8;white-space:nowrap}
  .card-title{font-size:13px;font-weight:600;color:var(--ink);flex:1}
  .chevron{color:var(--faint);font-size:12px;transition:transform .2s}
  .chevron.open{transform:rotate(90deg)}
  .card-body{display:none;padding:16px;border-top:1px solid var(--border)}
  .card-body.open{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  @media(max-width:560px){.card-body.open{grid-template-columns:1fr}}
  .section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .dot-blue{background:var(--accent)}
  .dot-green{background:var(--green)}
  .dot-amber{background:var(--amber)}
  .label-blue{color:var(--accent)}
  .label-green{color:var(--green)}
  .label-amber{color:var(--amber)}
  ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  li{font-size:12px;color:var(--muted);line-height:1.5;padding-left:10px;position:relative}
  li::before{content:'';position:absolute;left:0;top:7px;width:3px;height:3px;border-radius:50%;background:var(--border)}
  .section{border-left:2px solid var(--border);padding-left:12px}
  .section.blue{border-color:var(--accent)}
  .section.green{border-color:var(--green)}
  .section.amber{border-color:var(--amber)}
</style>

<div class="header">
  <div>
    <div class="header-label">Section 9 · Screen Specifications</div>
    <div class="header-title">9 screens &nbsp;·&nbsp; Elements, Actions & Acceptance Criteria</div>
  </div>
</div>

<div class="screens" id="screens"></div>

<script>
const screens = [
  {
    title:"Landing Page",
    elements:["Headline + subheadline (plain language)","Live anonymised earnings ticker","3-step 'how it works' section","Payout SLA badge","'Start Earning' CTA above the fold","FAQ anchor link"],
    actions:["'Start Earning' → triggers Google OAuth","Returning users → redirected to dashboard"],
    criteria:["LCP under 2 seconds","Earnings ticker updates every 30s from real ledger","CTA visible without scrolling at 375px width"]
  },
  {
    title:"Google OAuth / Sign-Up",
    elements:["Google OAuth popup via NextAuth.js","No custom form fields"],
    actions:["Select Google account","Approve permissions"],
    criteria:["New user record created in under 500ms","Device fingerprint captured on page load","First-timers → tutorial; returning users → dashboard"]
  },
  {
    title:"Sandbox Tutorial",
    elements:["3-step guided overlay","Simulated task card + fake URL input","Tooltips at each step","Progress indicator","'Complete Tutorial' button on step 3"],
    actions:["User follows guided steps","Pastes an example URL"],
    criteria:["Dashboard route-guarded until tutorial_completed = true","Cannot be skipped","Renders correctly at 320px minimum width"]
  },
  {
    title:"Main Dashboard",
    elements:["Wallet summary card (Pending, Available, Lifetime)","Queue of 5 task cards (type, payout, est. time)","'Accept Task' CTA","'Refresh Queue' button","Tasks completed today count"],
    actions:["'Accept Task' → Redis lock + opens Task Detail","'Refresh Queue' → fetches new batch","Wallet card → opens Wallet screen"],
    criteria:["Queue loads under 1 second","Taken slot shows toast + card replaced without full reload","Minimum 48px tap targets on mobile"]
  },
  {
    title:"Task Detail",
    elements:["Full task instructions (formatted HTML)","Required keyword highlighted","Target URL + payout","Lock countdown timer synced to server TTL","'Submit Proof' CTA","'Return to Queue' button"],
    actions:["'Submit Proof' → opens Submission screen","'Return to Queue' → releases Redis lock via API"],
    criteria:["Countdown timer is server-synced, not client-side","Instructions rendered as formatted HTML"]
  },
  {
    title:"Task Submission",
    elements:["URL input with inline format validation","Helper text","'Submit' button disabled until format passes","Async URL preview thumbnail","Resubmission note if retry"],
    actions:["Paste URL → client-side regex runs instantly","Click 'Submit' → triggers async validation"],
    criteria:["Submission API returns 200 OK in under 500ms (status: SUBMITTED)","Validation result polled every 5s for up to 60s","After 60s → 'Still processing, check History shortly'"]
  },
  {
    title:"Wallet",
    elements:["Available balance (prominent)","Pending balance in grey with 24-hour hold tooltip","Lifetime earnings","Transaction history paginated at 10/page","'Withdraw' button disabled with tooltip if balance under $10"],
    actions:["'Withdraw' → opens withdrawal flow","Tap transaction → opens detail modal"],
    criteria:["Ledger query renders under 200ms","Pending and Available are visually distinct"]
  },
  {
    title:"Admin Task Upload",
    elements:["CSV drag-and-drop zone","Template download link","Parsed preview table (error rows highlighted)","Visibility settings (Active / Scheduled + date picker)","'Publish Tasks' CTA"],
    actions:["Upload CSV → review errors → set schedule → publish"],
    criteria:["CSVs over 500 rows run as background job with email confirmation","Error rows show specific column name and reason","Publish is atomic"]
  },
  {
    title:"Admin Monitoring Dashboard",
    elements:["KPI cards (tasks today, pass rate, payout queue, active users)","7-day completion trend chart","Flagged users table (fraud score + signal breakdown)","Dispute queue","Payout status table"],
    actions:["Click flagged user → full history + signals","Resolve dispute → one-click approve or reject","Retry failed payout manually"],
    criteria:["Data auto-refreshes every 60 seconds","Ban action requires mandatory reason field before confirming"]
  }
];

const container = document.getElementById('screens');
screens.forEach((s,i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head" onclick="toggle(${i})">
      <span class="screen-num">S${String(i+1).padStart(2,'0')}</span>
      <span class="card-title">${s.title}</span>
      <span class="chevron" id="ch${i}">▶</span>
    </div>
    <div class="card-body" id="body${i}">
      <div class="section blue">
        <div class="section-label"><span class="dot dot-blue"></span><span class="label-blue">Elements</span></div>
        <ul>${s.elements.map(e=>`<li>${e}</li>`).join('')}</ul>
      </div>
      <div class="section green">
        <div class="section-label"><span class="dot dot-green"></span><span class="label-green">Actions</span></div>
        <ul>${s.actions.map(a=>`<li>${a}</li>`).join('')}</ul>
      </div>
      <div class="section amber">
        <div class="section-label"><span class="dot dot-amber"></span><span class="label-amber">Criteria</span></div>
        <ul>${s.criteria.map(c=>`<li>${c}</li>`).join('')}</ul>
      </div>
    </div>`;
  container.appendChild(card);
});

function toggle(i){
  const body = document.getElementById('body'+i);
  const ch = document.getElementById('ch'+i);
  const open = body.classList.toggle('open');
  ch.classList.toggle('open', open);
}
</script>
